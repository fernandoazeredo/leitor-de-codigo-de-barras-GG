name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicação
        run: npm run build

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: leitor-codigo-barras-gg
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Publicar Hosting e regras do Firestore
        run: npx --yes firebase-tools@latest deploy --only "hosting,firestore:rules" --project leitor-codigo-barras-gg --non-interactive

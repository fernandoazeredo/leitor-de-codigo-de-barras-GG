name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do aplicativo
        run: npm install

      - name: Compilar aplicação
        run: npm run build

      - name: Verificar alterações nas Functions
        id: functions_changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- functions/ firebase.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências das Functions
        if: steps.functions_changed.outputs.changed == 'true'
        run: npm --prefix functions install

      - name: Compilar Functions
        if: steps.functions_changed.outputs.changed == 'true'
        run: npm --prefix functions run build

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: leitor-codigo-barras-gg
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Publicar Hosting e regras do Firestore
        run: npx --yes firebase-tools@latest deploy --only "hosting,firestore:rules" --project leitor-codigo-barras-gg --non-interactive

      - name: Publicar Functions quando houver alteração
        if: steps.functions_changed.outputs.changed == 'true'
        run: npx --yes firebase-tools@latest deploy --only "functions" --project leitor-codigo-barras-gg --non-interactive
